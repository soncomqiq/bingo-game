<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-time Bingo</title>
    <script type="module">
      window.__BINGO_RUNTIME_CONFIG__ = window.__BINGO_RUNTIME_CONFIG__ || {};
      const runtimeConfig = window.__BINGO_RUNTIME_CONFIG__;
      window.__BINGO_SOCKET_URL__ = runtimeConfig.socketUrl ?? import.meta.env.VITE_SOCKET_URL ?? '';
      window.__BINGO_API_URL__ = runtimeConfig.apiBaseUrl ?? import.meta.env.VITE_API_URL ?? '';
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
