<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-time Bingo</title>
    <script type="module">
      window.__BINGO_RUNTIME_CONFIG__ = window.__BINGO_RUNTIME_CONFIG__ || {};
      const runtimeConfig = window.__BINGO_RUNTIME_CONFIG__;
      window.__BINGO_SOCKET_URL__ = runtimeConfig.socketUrl ?? import.meta.env.VITE_SOCKET_URL ?? '';
      window.__BINGO_API_URL__ = runtimeConfig.apiBaseUrl ?? import.meta.env.VITE_API_URL ?? '';
      const basePathRaw = import.meta.env.BASE_URL || '/';
      const basePath = basePathRaw.endsWith('/') ? basePathRaw.slice(0, -1) : basePathRaw;
      (function (l) {
        if (l.search.startsWith('?/')) {
          var searchPayload = l.search.slice(2);
          var segments = searchPayload.split('?');
          var pathnamePart = segments.shift() || '';
          var queryPart = segments.length ? '?' + segments.join('?') : '';
          var restoredPath = pathnamePart.replace(/~and~/g, '&');
          if (!restoredPath.startsWith('/')) {
            restoredPath = '/' + restoredPath;
          }
          var finalPath = (basePath && basePath !== '/' ? basePath : '') + restoredPath + queryPart + l.hash;
          window.history.replaceState(null, null, finalPath || '/');
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
