<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <script>
      (function (l) {
        var repoBase = '/bingo-game';
        if (l.search.startsWith('?/')) {
          return;
        }
        var path = l.pathname.startsWith(repoBase) ? l.pathname.slice(repoBase.length) : l.pathname;
        var cleanedPath = path.replace(/^\/+/, '').replace(/&/g, '~and~');
        var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        var redirectPath = repoBase + '/?/' + cleanedPath + query + l.hash;
        l.replace(redirectPath);
      })(window.location);
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
