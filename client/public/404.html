<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <script>
      (function (l) {
        var repoBase = '/bingo-game';
        var hasBase = l.pathname.startsWith(repoBase);
        var relativePath = (hasBase ? l.pathname.slice(repoBase.length) : l.pathname)
          .replace(/^\/+/, '');
        var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        var redirectUrl =
          l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          repoBase +
          '/?/' +
          relativePath.replace(/&/g, '~and~') +
          search +
          l.hash;
        l.replace(redirectUrl);
      })(window.location);
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
